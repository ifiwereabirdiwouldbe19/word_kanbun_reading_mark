        const measureCtx = document.createElement('canvas').getContext('2d');

        //あとでオブジェクトを入れられるように念のためにオブジェクトようってことを

        // zipファイルの中身を取り出す関数（クロードに作ってもらった）
         // 【足す①】圧縮された中身を元に戻す
        async function inflateRaw(bytes) {
            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            return new Uint8Array(await new Response(stream).arrayBuffer());
        }

        // 【足す②】箱を開ける：裏表紙 → 目次 → 中身
        async function unzip(buf) {
            const u8 = new Uint8Array(buf);
            const dv = new DataView(buf);

            // 裏表紙（50 4b 05 06）を後ろから探す
            let eocd = -1;
            for (let i = u8.length - 22; i >= 0; i--) {
                if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
            }
            if (eocd < 0) throw new Error('.docx ではないみたい');

            const count = dv.getUint16(eocd + 10, true);   // 中身の数
            let p = dv.getUint32(eocd + 16, true);          // 目次の場所

            const files = [];
            for (let n = 0; n < count; n++) {
                const method  = dv.getUint16(p + 10, true);  // 0=そのまま 8=圧縮
                const cSize   = dv.getUint32(p + 20, true);  // 圧縮後の大きさ
                const nameLen = dv.getUint16(p + 28, true);
                const extLen  = dv.getUint16(p + 30, true);
                const cmtLen  = dv.getUint16(p + 32, true);
                const lo      = dv.getUint32(p + 42, true);  // ラベルの場所
                const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));

                // ラベルの後ろが中身
                const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
                const raw = u8.subarray(start, start + cSize);
                const data = method === 8 ? await inflateRaw(raw) : raw;

                files.push({ name, data });
                p += 46 + nameLen + extLen + cmtLen;          // 目次の次の項目へ
            }
            return files;
        }

        //zipを作る関数（クロード作成）
                // CRC32（zip に入れるファイルごとの検査用の数）を計算するための表
        const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n;
            for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
        const crc32 = u8 => { let c = 0xFFFFFFFF; for (const b of u8) c = CRC[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

        // files（{name, data} の配列）を zip にする。unzip の逆
        function zip(files) {
            const enc = new TextEncoder(), parts = [], central = [];
            let offset = 0;
            for (const f of files) {
                const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
                const lh = new DataView(new ArrayBuffer(30));          // ラベル（各ファイルの前に付ける）
                lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
                lh.setUint16(12, 0x21, true);
                lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
                lh.setUint16(26, name.length, true);
                parts.push(new Uint8Array(lh.buffer), name, f.data);

                const ch = new DataView(new ArrayBuffer(46));          // 目次の1項目
                ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
                ch.setUint16(8, 0x0800, true); ch.setUint16(14, 0x21, true);
                ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
                ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
                central.push(new Uint8Array(ch.buffer), name);
                offset += 30 + name.length + size;
            }
            const cdSize = central.reduce((n, a) => n + a.length, 0);
            const end = new DataView(new ArrayBuffer(22));             // 裏表紙
            end.setUint32(0, 0x06054b50, true);
            end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
            end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
            return new Blob([...parts, ...central, new Uint8Array(end.buffer)]);
        }

        //鍵括弧と句読点を詰めるかどうか設定をみる関数（クロード考案）

                // 返り点 mark を入れた「浮かせた箱」の run を、XML の文字列で作る
        function kaeriRunXML(mark, id, fontXML) {
            const EMU = 12700;                        // 1pt = 12700 EMU
            const e = KAERI.box * EMU;                // 箱の大きさ
            return `<w:r xmlns:w="${W}" xmlns:wp="${WP}" xmlns:a="${A}" xmlns:wps="${WPS}" xmlns:mc="${MC}">
        <mc:AlternateContent><mc:Choice Requires="wps"><w:drawing>
        <wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="${251660000 + id}" behindDoc="1" locked="0" layoutInCell="1" allowOverlap="1">
        <wp:simplePos x="0" y="0"/>
        <wp:positionH relativeFrom="character"><wp:posOffset>${KAERI.right * EMU}</wp:posOffset></wp:positionH>
        <wp:positionV relativeFrom="line"><wp:posOffset>${KAERI.down * EMU}</wp:posOffset></wp:positionV>
        <wp:extent cx="${e}" cy="${e}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:wrapNone/>
        <wp:docPr id="${id}" name="返り点 ${id}" descr="kaeriten"/><wp:cNvGraphicFramePr/>
        <a:graphic><a:graphicData uri="${WPS}"><wps:wsp><wps:cNvSpPr txBox="1"/>
        <wps:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${e}" cy="${e}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/><a:ln><a:noFill/></a:ln></wps:spPr>
        <wps:txbx><w:txbxContent><w:p><w:pPr><w:snapToGrid w:val="0"/><w:spacing w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr>
        <w:r><w:rPr>${fontXML}<w:sz w:val="${KAERI.font * 2}"/></w:rPr><w:t>${mark}</w:t></w:r></w:p></w:txbxContent></wps:txbx>
        <wps:bodyPr rot="0" vert="eaVert" wrap="none" lIns="0" tIns="0" rIns="0" bIns="0" anchor="ctr" anchorCtr="0"><a:noAutofit/></wps:bodyPr>
        </wps:wsp></a:graphicData></a:graphic></wp:anchor></w:drawing></mc:Choice></mc:AlternateContent></w:r>`
                .replace(/>\s+</g, '><');             // 見やすさのための改行を消す
        }

        // 範囲の字と、今付いている返り点を下書きにして、モーダルを開く

        // モーダルの中身を、下書きに合わせて描き直す
        function drawDialog() {
            const { para, start, marks } = SEL;
            dlgChars.innerHTML = '';

        // w:t の at 文字目から後ろを、新しい run に移す。新しい run の w:t を返す
        function cutRun(t, at) {
            const r = t.parentNode;
            const kids = [...r.children], k = kids.indexOf(t);
            const after = r.cloneNode(true);                         // run を丸ごと複製
            const akids = [...after.children];
            akids.slice(0, k).forEach(c => { if (c.localName !== 'rPr') c.remove(); });  // 複製から前の部分を消す
            akids[k].textContent = t.textContent.slice(at);         // 複製の w:t は後ろ半分
            kids.slice(k + 1).forEach(c => c.remove());              // 元から後ろの部分を消す
            t.textContent = t.textContent.slice(0, at);              // 元の w:t は前半分
            for (const x of [t, akids[k]])                           // 前後の空白が消えないように
                x.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
            r.after(after);
            return akids[k];
        }

        function parseMark(s) {
            const re = (s || '').includes('レ');               // レ を含むか（レ、一レ、上レ）
            const base = (s || '').replace('レ', '');           // レ 以外の部分（一、上 など）
            const g = GROUPS.findIndex(x => x.includes(base));  // どのグループか
            return { re, g, rank: g >= 0 ? GROUPS[g].indexOf(base) : -1 };   // rank：0 なら一・上・甲・天
        }

        // marks[k] は k 文字目の返り点。読む順の番号の配列を返す
        function readingOrder(marks) {
            const n = marks.length, P = marks.map(parseMark);
            const done = new Array(n).fill(false), order = [];
            const hold = GROUPS.map(() => []);                  // 一・上 などを待っている字

            function read(k) {
                if (done[k]) return;
                done[k] = true;
                order.push(k);
                const m = P[k];
                if (m.rank === 0) {                             // 一・上・甲・天 を読んだ → 待っていた二・三… を順に読む
                    const h = hold[m.g].sort((a, b) => P[a].rank - P[b].rank);
                    hold[m.g] = [];
                    h.forEach(read);
                }
                if (k > 0 && P[k - 1].re) read(k - 1);         // すぐ上の字が レ なら、続けて読む
            }

            for (let k = 0; k < n; k++) {
                const m = P[k];
                if (m.re) continue;                             // レ・一レ：すぐ下の字を読むまで待つ
                if (m.rank > 0) { hold[m.g].push(k); continue; } // 二・三・下 など：一・上 を待つ
                read(k);
            }
            for (let k = 0; k < n; k++) if (!done[k]) order.push(k);   // 付け方がおかしくて残った字
            return order;
        }



        // 文書の中で使われている図の番号（docPr の id）の、次の番号
        function nextDocPrId() {
            let max = 0;
            for (const d of DOC.getElementsByTagNameNS(WP, 'docPr')) max = Math.max(max, Number(d.getAttribute('id')) || 0);
            return max + 1;
        }

        // para の i 文字目の字の後ろに、返り点 mark を差し込む
        function insertMark(para, i, mark) {
            const m = para.map[i];
            if (!m) return;
            const { t, pos } = m;
            // 親の字の後ろで run を切る（親の字が w:t の最後の字なら切らなくてよい）
            if (pos < t.textContent.length - 1) cutRun(t, pos + 1);
            const r = t.parentNode;
            // 返り点のフォントは、親の字と同じにする
            const rf = child(child(r, 'rPr'), 'rFonts');
            const fontXML = rf ? new XMLSerializer().serializeToString(rf) : '';
            // 文字列の XML を要素にして、親の字の run のすぐ後ろに入れる
            const xml = kaeriRunXML(mark, nextDocPrId(), fontXML);
            const node = new DOMParser().parseFromString(xml, 'application/xml').documentElement;
            r.after(DOC.importNode(node, true));
        }
        // 返り点の文字を書き換える
        function editMark(m, mark) {
            // 箱の中身は、新旧の Word 用に2か所あることがあるので、全部書き換える
            for (const box of m.run.getElementsByTagNameNS(W, 'txbxContent')) {
                const ts = [...box.getElementsByTagNameNS(W, 't')];
                ts[0].textContent = mark;                 // 1つ目の w:t を新しい返り点にする
                ts.slice(1).forEach(t => t.remove());     // 2つ目以降があれば消す
            }
        }

        // 返り点を消す（返り点の run を丸ごと取り除く）
        function removeMark(m) {
            m.run.remove();
        }

        //文字の大きさを取り出す関数
        function readBaseSize(styles) {
            let sz = 21;                                       // ❶ 何も書いていなければ 10.5pt
            if (!styles) return sz / 2;

            // ❷ 文書全体の初期値
            const def = styles.getElementsByTagNameNS(W, 'docDefaults')[0];
            const dsz = def && def.getElementsByTagNameNS(W, 'sz')[0];
            if (dsz) sz = Number(attr(dsz, 'val'));

            // ❸ 標準スタイル（default="1" の段落スタイル）
            const normal = [...styles.getElementsByTagNameNS(W, 'style')]
                .find(s => attr(s, 'type') === 'paragraph' && attr(s, 'default') === '1');
            const nsz = normal && normal.getElementsByTagNameNS(W, 'sz')[0];
            if (nsz) sz = Number(attr(nsz, 'val'));

            return sz / 2;                                     // ❹ ポイントの2倍で書いてあるので2で割る
        }

        function readTheme (theme){
            const t = {};
            if (!theme)return t;
            for(const kind of ['major','minor']){
                const box = theme.getElementsByTagName('a:'+kind+'Font')[0];
                if(!box)continue;
                const latin = box.getElementsByTagName('a:latin')[0];
                const jpan = [...box.getElementsByTagName('a:font')].find(f => f.getAttribute('script') === 'Jpan');
                t[kind + 'Latin'] = latin ? latin.getAttribute('typeface') : '';
                t[kind + 'Jpan'] = jpan ? jpan.getAttribute('typeface') : '';

            }
            return t;
        }

        function fontFromRFonts(rf,theme){
            if(!rf)return null;
            const name = attr(rf,'eastAsia');
            if(name)return name;
            const th = attr(rf,'eastAsiaTheme');
            if(!th)return null;
            const kind = th.startsWith('major') ? 'major' : 'minor';
            return /EastAsia$/.test(th) ? theme[kind + 'Jpan'] : theme[kind + 'Latin'];

        }
        function latinFontFromRFonts(rf, theme) {
            if (!rf) return null;
            const name = attr(rf, 'ascii');
            if (name) return name;
            const th = attr(rf, 'asciiTheme');
            if (!th) return null;
            return theme[(th.startsWith('major') ? 'major' : 'minor') + 'Latin'];
        }
        function readBaseFont(styles,theme) { 
            let font = null;
            if (!styles)return font;
            const def = styles.getElementsByTagNameNS(W,'docDefaults')[0];
            const f1 = fontFromRFonts(def && def.getElementsByTagNameNS(W,'rFonts')[0],theme);
            if(f1) font = f1;
            const normal = [...styles.getElementsByTagNameNS(W,'style')].find(s => attr(s,'type') === 'paragraph' && attr(s,'default') === '1');
            const f2 = fontFromRFonts(normal && normal.getElementsByTagNameNS(W,'rFonts')[0],theme);
            if(f2) font = f2;
            return font;
        }

        const cssFont = name => {
            const gothic = /ゴシック|Gothic|Sans|メイリオ|Meiryo/i.test(name || '');
            const fallback = gothic
                ? "'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif"
                : "'MS Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif";
                return name ? `'${name}',${fallback}` : fallback;
        }

        //セクションに書かれた設定をオブジェクトに直す関数
        function readSect(sp, basePt, baseFont) {
            const pgSz = sp.getElementsByTagNameNS(W, 'pgSz')[0];
            const pgMar = sp.getElementsByTagNameNS(W, 'pgMar')[0];
            const grid = sp.getElementsByTagNameNS(W, 'docGrid')[0];
            const dir = sp.getElementsByTagNameNS(W, 'textDirection')[0];
            
            const s = {
                width: pt(Number(attr(pgSz, 'w'))),  height: pt(Number(attr(pgSz, 'h'))),
                top: pt(Number(attr(pgMar, 'top'))), bottom: pt(Number(attr(pgMar, 'bottom'))),
                left: pt(Number(attr(pgMar, 'left'))), right: pt(Number(attr(pgMar, 'right'))),
                vertical: attr(dir, 'val') === 'tbRl',          // 縦書きなら true
                fontPt: basePt,                                  // ①で読んだ 16pt
                font: baseFont,
            };
                // 字送り（1字の幅）と行送り（1行の幅）
            const charSpace = attr(grid, 'charSpace');
            const linePitch = attr(grid, 'linePitch');
            s.charPt = charSpace !== null ? basePt + Number(charSpace) / 4096 : basePt;
            s.linePt = linePitch !== null ? pt(Number(linePitch)) : basePt * 1.5;
                // 縦書きは「上から下」が1行、横書きは「左から右」が1行
            const lineLen = s.vertical ? s.height - s.top - s.bottom : s.width - s.left - s.right;
            const across  = s.vertical ? s.width - s.left - s.right  : s.height - s.top - s.bottom;
            s.chars = Math.floor(lineLen / s.charPt + 0.01);    // 1行の字数
            s.lines = Math.floor(across / s.linePt + 0.01);     // 1ページの行数

            return s;
        };
 
        // 段落の中のテキストだけでなく、字下げや行揃え、フォントサイズの情報も取り出す関数
        function text_take(p,s){
            let text = '';
            const tcy = [];
            const images = [];
            const map = [];
            const marks = [];

            const inTextBox = el => {
                for (let e = el.parentNode;e; e = e.parentNode) if (e.localName === 'txbxContent') return true;
                return false;
            }
            for (const r of p.getElementsByTagNameNS(W, 'r')) {
                if(inTextBox(r)) continue;
                let rt = '';
                //brの時は改行しなきゃいけないから、brの時は改行を入れるようにする
                for (const c of r.children){
                    if(c.localName === 't'){
                        for (let k = 0; k < c.textContent.length; k++) map.push({ t: c, pos: k }); 
                        rt += c.textContent;
                    }else if (c.localName === 'br'){
                        const type = attr(c,'type');
                         if(type !== 'page' && type !== 'column') { rt += '\n'; map.push(null);}
                    }else if (c.localName === 'drawing') {
                        const im = readDrawing(c);
                        if (im) images.push(im);
                    }else if (c.localName === 'AlternateContent') {      
                        // 返り点の箱か？（insertMark で付けた目印 descr="kaeriten" を見る）
                        const pr = c.getElementsByTagNameNS(WP, 'docPr')[0];
                        if (pr && pr.getAttribute('descr') === 'kaeriten') {
                            const box = c.getElementsByTagNameNS(W, 'txbxContent')[0];
                            const mt = [...box.getElementsByTagNameNS(W, 't')].map(t => t.textContent).join('');
                            marks.push({ at: text.length + rt.length - 1, text: mt, run: r });
                        }
                    }
                }

                // const rt = [...r.getElementsByTagNameNS(W, 't')].map(t => t.textContent).join('');
                if (!rt) continue;
                const ea = child(child(r,'rPr'),'eastAsianLayout');
                const v = attr(ea,'vert');
                // const v = attr(child(child(r, 'rPr'), 'eastAsianLayout'), 'vert');
                if (v && v !== '0' && v !== 'false' && v !== 'off') {
                    const id = attr(ea, 'id');
                    const last = tcy[tcy.length - 1];
                    if (last && id !== null && last.id === id && last.end === text.length) last.end += rt.length;
                    else tcy.push({ start: text.length, end: text.length + rt.length, id });
                }
                text += rt;
            }
            // const text = [...p.getElementsByTagNameNS(W, 't')].map(t => t.textContent).join('');
            const pPr = child(p, 'pPr');
            const ind = child(pPr, 'ind');                       // 字下げの設定
            const jc = attr(child(pPr, 'jc'), 'val');  
            const chars = (cName, twName) => {
            const c = attr(ind, cName);
            if (c !== null) return Number(c) / 100;          // 〇〇Chars があれば：100 で1字
                const t = attr(ind, twName);
                return t !== null ? pt(Number(t)) / s.charPt : 0; // なければ twip → pt → 字数
            };
            //leftcharsは段落全体の字下げ200
            let left  = chars('leftChars', 'left') || chars('startChars', 'start');
            const hang = chars('hangingChars', 'hanging');
            //ぶら下げ分をleftに足したいが、xmlのleftにはすでに足した値のtwipの値が入っているので、その場合は足さないようにする
            const byChars = attr(ind, 'leftChars') !== null || attr(ind, 'startChars') !== null;
            if (hang && byChars) {
                left = hang + left;
            }
            //hangingcharsはぶら下げの字下げだから一行目の場合は字上げ1700
            //firstlinecharsは一行目の字下げ
            const first = chars('firstLineChars', 'firstLine') - chars('hangingChars', 'hanging');

            const pageBreak = [...p.getElementsByTagNameNS(W, 'br')].some(b => attr(b, 'type') === 'page');
            const breakBefore = !!child(pPr, 'pageBreakBefore');
            // const run = [...p.getElementsByTagNameNS(W, 'r')].find(r => (r.textContent || '').trim());
            const run = [...p.getElementsByTagNameNS(W, 'r')].find(r => !inTextBox(r) && (r.textContent || '').trim());
            const sz = run && child(child(run, 'rPr'), 'sz');
            const sizePt = sz ? Number(attr(sz, 'val')) / 2 : s.fontPt;
            const font = fontFromRFonts(child(child(run, 'rPr'), 'rFonts'), THEME) || s.font;
            const latinFont = latinFontFromRFonts(child(child(run, 'rPr'), 'rFonts'), THEME) || font;
            return { text, left, first, jc, pageBreak, breakBefore, sizePt, font, tcy, images, latinFont, map, marks, el: p };
        }
        
        //段落の文章を行ごとに分割
        function splitLines(para,s){
            // 1行に入る文字数を計算する。字下げ分を引く。
            const one_line = Math.max(1,s.chars - Math.round(para.left));
            //テキストが空でも、一行として扱う
            if (!para.text) return [''];
            const t = para.text, out = [];
            let start = 0, used = Math.round(para.first);
            let slack = 0;   
            

            //テキストの文字数分循環
            for (let i = 0; i < t.length; i++){
                if(t[i] === '\n'){
                    //縦中横数えるやつには\nが一文字に入るらしいんでbrのところ新しく改行するところは\nも含めちゃう
                    out.push(t.slice(start, i + 1));
                    start = i + 1;
                    used = 0;
                    slack = 0;
                    continue;
                }
                const g = para.tcy.find(g => g.start === i);
                //半角か全角かで文字の幅を計算
                let w = cellOf(t[i], s);
                let len = 1;
                if (g) {
                    w = 1;
                    len = g.end - g.start;//100とかだったら3,20とかだったら２
                }else if(isLatin(t[i])){
                        let k = i;
                        while (k < t.length && isLatin(t[k]) && !para.tcy.some(g => g.start === k)) k++;
                        w = latinCells(t.slice(i, k), s, para.font);
                        len = k - i;
                        if (w > one_line) {          // 1行に収まらないほど長い単語は、1文字ずつに戻す
                            w = latinCells(t[i], s, para.font);
                            len = 1;
                        }
                         
                }else if (PUNCT.includes(t[i])) {
                    w = (s.compress && halfAt(t, i)) ? 0.5 : 1;
                }

                const tol = (s.charPt - s.fontPt) / s.charPt;
                //一行に入る文字より大きくなった時、一行分を切り出してoutにいれるよっ
                if ( used + w > one_line + tol && i > start ){
                        const next = t[i + len] ?? '';
                        const kinsoku = OPEN.includes(t[i - 1]); //|| HANG.includes(next);
                        if (s.compress && kinsoku && used + w - one_line <= slack) {
                            used += w;
                            if (s.compress && PUNCT.includes(t[i]) && w === 1) slack += 0.5;
                            i += len - 1;
                            continue;
                        }

                    //startからｊまでの文字を切り出してoutに入れる
                    let j = i;
                    //大きくなる分が一～二文字文で、かつ「。」とか「、」の時
                    while (j < t.length && j - i < 2 && HANG.includes(t[j])) j++;  
                    out.push(t.slice(start, j));
                    start = j; i = j -1; used = 0;  //startを続きから、
                    slack = 0;
                    continue;
                }
                //最後じゃないなら普通に一文字の幅を足していく
                used += w;
                if (s.compress && PUNCT.includes(t[i]) && w === 1) slack += 0.5;

                //縦中横の場合は数字は一文字としてカウントするから、そう進める
                 i += len - 1;
                
            }
            //。とかじゃなくて普通に最後の一文字なら普通に最後の一行として出す
            if (start < t.length) out.push(t.slice(start));
            return out;
        }

        //wordのzipではテキストが一ページごとに切り分けられていないためHTML上で切り分ける
        function makePage(s){
            const page = document.createElement('div');
            Object.assign(page.style, {
                width: s.width + 'pt',height: s.height + 'pt',
                padding: `${s.top}pt ${s.right}pt ${s.bottom}pt ${s.left}pt`,
                boxSizing: `border-box`,background: `#fff`,margin: `16px auto`,
                boxShadow: `0 1px 4px rgba(0,0,0,.3)`,overflow: 'hidden',
            });
            const inner = document.createElement('div');
            Object.assign(inner.style,{
                writingMode: s.vertical ? 'vertical-rl' : 'horizontal-tb',//縦書きか否か
                fontFamily: cssFont(s.font),
                fontSize: s.fontPt + 'pt',
                lineHeight: s.linePt + 'pt',
                letterSpacing: (s.charPt - s.fontPt) + 'pt',
                width: '100%',height: '100%',
                textSpacingTrim: 'space-all',
                position: 'relative',
                zIndex: '1'
            })
            page.appendChild(inner);
            pagesBox.appendChild(page);
            return inner;
        }

        //ますの線を書く
        function makeLine(text, para, s, isFirst,off = 0){
            const d = document.createElement('div');

                if (!text) {
                    d.textContent = '\u200b';   // 空の行でも高さを持たせる見えない文字
                } else {
                    for (let i = 0; i < text.length; i++) {
                        //ここは縦中横kana？
                        const g = para.tcy.find(g => g.start === off + i );
                        if(g){
                            const len = g.end - g.start;
                            const sp = document.createElement('span');
                            sp.textContent = text.slice(i,i + len);//縦中横の文字までの分をとりだして入れる
                            sp.style.textCombineUpright = 'all';
                            d.append(sp);
                            i += len - 1;
                            continue;
                        }
                        //英字判定
                        if (isLatin(text[i])) {
                            let k = i;
                            while (k < text.length && isLatin(text[k]) && !para.tcy.some(g => g.start === off + k)) k++;
                            const sp = document.createElement('span');
                            sp.textContent = text.slice(i, k);
                            sp.style.letterSpacing = '0';
                            d.append(sp);
                            i = k - 1;
                            continue;
                        }
                        const ch = text[i];
                        const sp = document.createElement('span');
                        sp.textContent = ch;
                        sp.dataset.p = para.no;
                        sp.dataset.i = off + i;
                        const prevP = i > 0 && PUNCT.includes(text[i - 1]);               // 前が。とかか
                        const nextP = i < text.length - 1 && PUNCT.includes(text[i + 1]); // 後ろが。とかか
                        if (s.compress && PUNCT.includes(ch) && (prevP || nextP)) {
                            // 続いた場合、 → span で囲んで半分に詰める
                            sp.style.textSpacingTrim = 'trim-all';
                            sp.style.letterSpacing = ((s.charPt - s.fontPt) / 2) + 'pt';
                            // d.append(sp);
                        }
                        for(const m of para.marks.filter(m => m.at === off + i)){
                            sp.style.position = 'relative';           // 返り点の位置の基準にする
                            const ms = document.createElement('span');
                            ms.textContent = m.text;
                            Object.assign(ms.style, {
                                position: 'absolute',                  // 字の並びに影響しない
                                left: KAERI_VIEW.left + 'pt',
                                top: KAERI_VIEW.top + 'pt',
                                width: KAERI.box + 'pt',
                                height: KAERI.box + 'pt',
                                lineHeight: KAERI.box + 'pt',
                                fontSize: KAERI.font + 'pt',
                                letterSpacing: '0',
                                textAlign: 'center',
                            });
                            sp.append(ms);
                        }
                        
                        // else {
                        //     // それ以外 → そのまま文字として入れる
                            d.append(sp);
                        // }
                    }
                }
            d.style.whiteSpace = 'pre';
            d.style.paddingInlineStart = (para.left * s.charPt) + 'pt';
            if( isFirst && para.first ) d.style.textIndent = ( para.first * s.charPt ) + 'pt';
            if(para.sizePt !== s.fontPt){
                d.style.fontSize = para.sizePt + 'pt';
                d.style.letterSpacing = Math.max(0, s.charPt - para.sizePt ) + 'pt';
                
            }
            if(para.font !== s.font) d.style.fontFamily = cssFont(para.font);//基準のフォントと違かったら元のやつを採用
            if(para.jc === 'center') d.style.textAlign = 'center';
            if(para.jc == 'right' || para.jc === 'end') d.style.textAlign = 'end';
            
            return d;    
        }

        function splitSections(doc) {
            const body = doc.getElementsByTagNameNS(W, 'body')[0];
            const sections = [];
            let paras = [];
            for (const el of body.children) {
                if (el.localName === 'p') {                        // 段落なら
                    paras.push(el);                                // 部品をそのままためる
                    const sp = child(child(el, 'pPr'), 'sectPr');
                    if (sp) {                                      // 段落の中に sectPr があれば、ここで区切る
                        sections.push({ sp, paras });
                        paras = [];
                    }
                } else if (el.localName === 'sectPr') {            // body 直下の sectPr（最後のセクション）
                    sections.push({ sp: el, paras });
                    paras = [];
                }
            }
            return sections;
        }

        //クロード考案、画像の場所を調べてURLにする関数群
        // rels を読んで { rId9: 'media/image1.png', … } にする
        function readRels(rels) {
            const map = {};
            if (!rels) return map;
            for (const el of rels.getElementsByTagName('Relationship')) {
                map[el.getAttribute('Id')] = el.getAttribute('Target');
            }
            return map;
        }

        // rId から、ブラウザで表示できる URL を作る
        function imageURL(rid) {
            const target = RELS[rid];
            if (!target) return null;
            const path = target.startsWith('/') ? target.slice(1) : 'word/' + target;
            const f = FILES.find(f => f.name === path);
            if (!f) return null;
            const ext = path.split('.').pop().toLowerCase();
            const type = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', bmp: 'image/bmp' }[ext] || '';
            return URL.createObjectURL(new Blob([f.data], { type }));
        }

        // <w:drawing> から、大きさ・位置・画像の番号を読む
        function readDrawing(dr) {
            const anchor = dr.getElementsByTagNameNS(WP, 'anchor')[0];
            const box = anchor || dr.getElementsByTagNameNS(WP, 'inline')[0];
            if (!box) return null;
            const ext  = box.getElementsByTagNameNS(WP, 'extent')[0];
            const blip = dr.getElementsByTagNameNS(A, 'blip')[0];
            const pos = tag => {
                const p = box.getElementsByTagNameNS(WP, tag)[0];
                const o = p && p.getElementsByTagNameNS(WP, 'posOffset')[0];
                return { from: p ? p.getAttribute('relativeFrom') : 'column', off: o ? emu(o.textContent) : 0 };
            };
            return {
                rid: blip && blip.getAttributeNS(R, 'embed'),
                w: emu(ext.getAttribute('cx')),
                h: emu(ext.getAttribute('cy')),
                behind: !!anchor && anchor.getAttribute('behindDoc') === '1',
                posH: pos('positionH'),
                posV: pos('positionV'),
            };
        }
        function placeImages(para, s, inner) {
            const page = inner.parentElement;           // 紙そのもの
            page.style.position = 'relative';
            for (const im of para.images) {
                const url = imageURL(im.rid);
                if (!url) continue;
                // 「page」基準なら紙の端から、それ以外は本文の領域（余白の内側）から測る
                const x = (im.posH.from === 'page' ? 0 : s.left) + im.posH.off;
                const y = (im.posV.from === 'page' ? 0 : s.top)  + im.posV.off;
                const el = document.createElement('img');
                el.src = url;
                Object.assign(el.style, {
                    position: 'absolute',
                    left: x + 'pt', top: y + 'pt',
                    width: im.w + 'pt', height: im.h + 'pt',
                    zIndex: im.behind ? '0' : '2',      // 文字の後ろなら下、前なら上
                });
                page.appendChild(el);
            }
        }

        function render() {
            
            pagesBox.innerHTML = '';
            //からにする
            PARAS = [];
            console.log('からにするよ')

            //入れ子に整形する。セクションと段落の関係を整理する
            const sections = splitSections(DOC);
            for (const sec of sections) {
            const s = readSect(sec.sp, CTX.basePt, CTX.baseFont);    // ② セクションの設定を読む
            s.compress = CTX.compress !== 'doNotCompress';  // 鍵括弧と句読点を詰めるかどうか
            let inner = null, used = 0;



                for (const p of sec.paras) {
                    //文字をとって
                    const para = text_take(p, s);
                    para.no = PARAS.length;
                    PARAS.push(para);

                    //行ごとにわけて
                    const lines = splitLines(para, s);

                    //offには、その行が何文字目からはじまるかいれる
                    let off = 0;

                    //紙につめていく
                    lines.forEach((line,k) => {
                        //紙がなかったら新しい紙を作る
                        if (!inner || used >= s.lines){
                            //セクションの設定をよみとって紙
                            inner = makePage(s);
                            used = 0;
                        }
                        //行のdivをつくって紙にいれる
                        const d = makeLine(line, para, s, k === 0,off);
                        inner.appendChild(d);
                        if (k === 0 && para.images.length) placeImages(para, s, inner); 
                        //行数をカウント
                        used++;
                        off += line.length;
                    })
                }  
            } 
        }

        document.getElementById('dlgApply').onclick = () => {

                const i = start + k, mk = marks[k];
                const old = para.marks.find(m => m.at === i);
                if (old && !mk) removeMark(old);                        // あった → なくした：消す
                else if (old && mk !== old.text) editMark(old, mk);     // あった → 変えた：直す
                else if (!old && mk && para.map[i]) insertMark(para, i, mk);   // なかった → 付けた：付ける
            }
            dlg.close();
            window.getSelection().removeAllRanges();   // 本文の選択を解除
            render();
        };

        document.getElementById('dlgCancel').onclick = () => dlg.close();
    </script>
</html>
